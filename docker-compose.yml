# Produção em VPS compartilhada — ver docs/DEPLOY.md.
#
# O proxy reverso e o TLS são do Traefik v2 JÁ EXISTENTE na VPS (ele ocupa as
# portas 80/443 e atende outros sites). Este compose NÃO publica porta
# nenhuma: o Traefik alcança o container pela rede interna n8n_default e
# descobre o serviço pelas labels abaixo (exposedByDefault=false lá).
#
# O Compose lê o .env desta pasta automaticamente, tanto para os `args` de
# build (NEXT_PUBLIC_*, que entram no bundle) quanto para o env_file de runtime.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    image: full-electric-site:latest
    container_name: full-electric-app
    env_file: .env
    restart: unless-stopped
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      # HTTP (:80) → redireciona para HTTPS. O desafio ACME do resolver `le`
      # (httpChallenge no entrypoint web) é atendido pelo Traefik antes do router.
      - "traefik.http.routers.full-electric-web.rule=Host(`fulleletric.unysystens.com.br`)"
      - "traefik.http.routers.full-electric-web.entrypoints=web"
      - "traefik.http.routers.full-electric-web.middlewares=full-electric-redirect"
      - "traefik.http.middlewares.full-electric-redirect.redirectscheme.scheme=https"
      # HTTPS (:443) com certificado Let's Encrypt
      - "traefik.http.routers.full-electric.rule=Host(`fulleletric.unysystens.com.br`)"
      - "traefik.http.routers.full-electric.entrypoints=websecure"
      - "traefik.http.routers.full-electric.tls=true"
      - "traefik.http.routers.full-electric.tls.certresolver=le"
      # Porta do Next standalone DENTRO do container (não é 80 como no lps-unyflex)
      - "traefik.http.services.full-electric.loadbalancer.server.port=3000"
    volumes:
      - next-cache:/app/.next/cache
    healthcheck:
      # Roda dentro do container, por isso 127.0.0.1:3000 funciona mesmo sem
      # porta publicada. A imagem slim não tem curl/wget; o próprio Node chama.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Dá tempo para o migrate deploy do entrypoint antes de contar falhas
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Rede do Traefik existente na VPS. Criada pelo compose do n8n; aqui só
  # nos conectamos a ela. `docker network ls` deve listá-la antes do up.
  n8n_default:
    external: true

volumes:
  # Cache das imagens otimizadas (/_next/image) — sobrevive a rebuilds
  next-cache:
